name: Matrix Build

on: push

jobs:
    build:
        runs-on: ububtu-latest

        strategy:
            matrix:
                java: [17,21]

        steps:
            - uses: actions/checkout@v4

            - name: Setup java
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: ${{matrix.java}}
            
            - name: show java version
              run : java --version
